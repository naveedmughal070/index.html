<body>
    <div class="quiz-container">
        <h1>🚗 Taxi License Quiz</h1>
        <div class="subtitle">Complete Practice - Part 1 & Part 2</div>
        
        <div class="part-toggle">
            <button class="part-btn active" onclick="switchPart(1)">Part 1 - Safety</button>
            <button class="part-btn" onclick="switchPart(2)">Part 2 - Driving</button>
        </div>

        <div class="lang-toggle">
            <button class="lang-btn active" onclick="setLanguage('sv')">Svenska</button>
            <button class="lang-btn" onclick="setLanguage('ur')">Roman Urdu</button>

        <div class="progress" id="progress">Fråga 1 av 20</div>

        <div class="question-selector" id="questionSelector"></div>

        <div class="question-box">

            <div class="question-urdu hidden" id="questionUrdu"></div>

        <div class="options" id="options"></div>

        <button class="btn" id="submit" onclick="checkAnswer()">Kontrollera svar</button>

        <div class="result hidden" id="result"></div>

        <div class="nav-buttons hidden" id="navButtons">

            <button class="btn btn-nav btn-next" onclick="nextQuestion()">Agla →</button>
        </div>

        <div class="score-box hidden" id="scoreBox">
            <div class="score-number" id="scoreNumber">0/0</div>
            <div id="scoreText">Rätta svar</div>
            <button class="btn" onclick="restartQuiz()" style="margin-top:15px;">Spela igen</button>
        </div>
    </div>

    <script>
        const quizDataPart1 = [
            {
                question: "Vad är den minsta tillåtna mönsterdjupet för sommardäck i Sverige?",
                questionUrdu: "Sweden mein summer tyres ki minimum legal depth kitni honi chahiye?",
                options: ["1.0 mm", "1.6 mm", "2.0 mm", "3.0 mm"],
                correct: 1,
                explanation: "I Sverige är det minsta tillåtna mönsterdjupet för sommardäck 1,6 mm.",
                explanationUrdu: "<strong>Sweden mein summer tyres ki minimum legal depth 1.6 mm hoti hai.</strong><br><br><strong>Kyun important hai?</strong><br>Agar tyre depth 1.6 mm se kam ho jaye to tyre barish ya geeli sadkon par pakad nahi kar pata aur car slip ho sakti hai. Isliye Sweden mein yeh law hai ke summer tyres kam az kam 1.6 mm deep hon."
            },
            {
                question: "Vad är den minsta tillåtna mönsterdjupet för vinterdäck i Sverige?",
                questionUrdu: "Sweden mein winter tyres ki minimum legal depth kitni honi chahiye?",
                options: ["1.6 mm", "2.0 mm", "3.0 mm", "4.0 mm"],
                correct: 2,
                explanation: "I Sverige är det minsta tillåtna mönsterdjupet för vinterdäck 3,0 mm.",
                explanationUrdu: "<strong>Sweden mein winter tyres ki minimum legal depth 3.0 mm hoti hai.</strong><br><br><strong>Kyun zyada depth?</strong><br>Winter tyres ko barf aur snow mein chalna hota hai. Zyada depth (3.0 mm) tyre ko barf mein behtar grip deti hai. Agar depth kam ho to barf par control mushkil ho jata hai aur accident ka khatra barh jata hai."
            },
            {
                question: "När ska den gula skyltlampan (skolbuss/skolzon) tändas?",
                questionUrdu: "Yellow school light kab on karni chahiye?",
                options: [
                    "När du ser en skolbuss",
                    "100 meter före och 100 meter efter skolan",
                    "Endast när barnen korsar vägen",
                    "Endast på morgonen"
                ],
                correct: 1,
                explanation: "Den gula skyltlampan ska tändas 100 meter före skolan och släckas 100 meter efter.",
                explanationUrdu: "<strong>Yellow light school se 100 meter pehle on karni hai aur 100 meter baad off karni hai.</strong><br><br><strong>Kyun?</strong><br>Yeh light doosre drivers ko alert karti hai ke yahan school zone hai aur bachon ka aana-jana hai. 100 meter pehle on karne se doosre drivers ko time milta hai ke woh speed kam karen aur zyada alert ho jayen."
            },
            {
                question: "Hur kontrollerar du att bilbältet fungerar korrekt?",
                questionUrdu: "Seatbelt theek hai ya nahi, yeh kaise check karenge?",
                options: [
                    "Genom att dra långsamt i det",
                    "Genom att ge det en snabb ryckning",
                    "Genom att titta på det",
                    "Genom att lossa det"
                ],
                correct: 1,
                explanation: "Du kontrollerar bilbältet genom att ge det en snabb ryckning – det ska låsa sig.",
                explanationUrdu: "<strong>Seatbelt ko tez jhatka dekar check karte hain - agar lock ho jaye to seatbelt sahi hai.</strong><br><br><strong>Kaise karen?</strong><br>Seatbelt ko pakad kar tez jhatka den. Agar seatbelt turant lock ho jaye (yani ruk jaye), to iska matlab seatbelt sahi kaam kar rahi hai. Slow pull mein seatbelt smoothly nikalna chahiye, lekin tez jhatka mein lock hona chahiye."
            },
            {
                question: "Var ska ett barn under 135 cm sitta i bilen för maximal säkerhet?",
                questionUrdu: "135 cm se kam height wala bacha gaadi mein kahan baithay for best safety?",
                options: [
                    "Fram med airbag på",
                    "Fram med airbag av",
                    "Bakåt i baksätet",
                    "Var som helst"
                ],
                correct: 2,
                explanation: "Barn under 135 cm ska sitta bakåt i baksätet för maximal säkerhet.",
                explanationUrdu: "<strong>135 cm se kam height wale bachon ko peeche ki seat par baithana chahiye for maximum safety.</strong><br><br><strong>Kyun peeche?</strong><br>Peeche ki seat sabse safe hoti hai kyunki accident mein front seat par zyada impact parta hai. Bachon ka body chhota hota hai aur unhein zyada protection chahiye. Isliye Sweden mein rule hai ke 135 cm se kam height wale bachon ko peeche baithana chahiye."
            },
            {
                question: "Vad gör du om ett barn måste sitta i framsätet?",
                questionUrdu: "Agar bacha front seat par baith raha ho to kya karna chahiye?",
                options: [
                    "Inget särskilt",
                    "Stäng av passagerarairbaggen",
                    "Sätt på varningsljusen",
                    "Kör långsammare"
                ],
                correct: 1,
                explanation: "Om ett barn sitter i framsätet måste passagerarairbaggen vara avstängd.",
                explanationUrdu: "<strong>Agar bacha front seat par hai to passenger airbag ko OFF karna zaroori hai.</strong><br><br><strong>Kyun?</strong><br>Airbag bahut tez speed mein open hoti hai (200-300 km/h). Agar bacha front seat par hai aur airbag open ho jaye, to bacha serious zakhmi ho sakta hai ya mar bhi sakta hai. Isliye agar kisi majboori mein bacha front seat par baith raha ho, to airbag ko OFF karna zaroori hai."
            },
            {
                question: "Vilken typ av bilbarnstol används för barn 0–9 månader?",
                questionUrdu: "0-9 mahine ke bachon ke liye kaunsi child seat use hoti hai?",
                options: [
                    "Framåtvänd stol",
                    "Bakåtvänd babyskydd",
                    "Bälteskudde",
                    "Utan stol"
                ],
                correct: 1,
                explanation: "För barn 0–9 månader används bakåtvänd babyskydd.",
                explanationUrdu: "<strong>0-9 mahine ke bachon ke liye rear-facing babyskydd use hoti hai.</strong><br><br><strong>Kyun rear-facing?</strong><br>Nanhe bachon ki gardan (neck) kamzor hoti hai. Accident mein agar bacha forward-facing ho to gardan par zyada zor parta hai. Rear-facing seat bachay ke pure body ko support deti hai aur neck ko protect karti hai. Isliye 0-9 mahine tak rear-facing seat use karni chahiye."
            },
            {
                question: "När kan ett barn sitta utan bilbarnstol/booster?",
                questionUrdu: "Bacha bina child seat/booster ke kab baith sakta hai?",
                options: [
                    "När barnet är 100 cm",
                    "När barnet är 120 cm",
                    "När barnet är 135 cm",
                    "När barnet är 10 år"
                ],
                correct: 2,
                explanation: "Barn kan sitta utan bilbarnstol/booster när de är 135 cm långa.",
                explanationUrdu: "<strong>Jab bacha 135 cm lamba ho jaye to woh bina booster ke seatbelt use kar sakta hai.</strong><br><br><strong>Kyun 135 cm?</strong><br>135 cm height par seatbelt bachay ke body par sahi tarah fit hoti hai - shoulder belt kandhay par aur lap belt hips par. Is se kam height par seatbelt galah ya neck par aa sakti hai jo dangerous hai. Isliye 135 cm tak booster seat use karna zaroori hai."
            },
            {
                question: "Hur aktiverar du barnlåset på bildörren?",
                questionUrdu: "Child lock kaise lagate hain gaadi ke darwaze par?",
                options: [
                    "Genom att trycka på en knapp",
                    "Genom att använda nyckel eller reglage på dörrkanten",
                    "Genom att dra i handtaget",
                    "Barnlåset aktiveras automatiskt"
                ],
                correct: 1,
                explanation: "Barnlåset aktiveras med nyckel eller reglage på dörrkanten.",
                explanationUrdu: "<strong>Child lock key ya switch se lagta hai jo darwaze ke kinare par hota hai.</strong><br><br><strong>Kaise karen?</strong><br>Darwaze ko kholen. Darwaze ke kinare (jahan latch hota hai) par ek chhota sa hole ya switch hoga. Usme key daal kar ghumayen ya switch ko move karen. Ab darwaza andar se nahi khulega, sirf bahar se khulega. Yeh bachon ko safe rakhta hai ke woh chalte waqt darwaza na khol den."
            },
            {
                question: "Vad är spolarvätska och varför är den viktig i Sverige?",
                questionUrdu: "Spolarvätska kya hai aur Sweden mein yeh kyun important hai?",
                options: [
                    "Motorolja",
                    "Kylarvätska",
                    "Vindrutetorkarvätska som inte fryser vid låga temperaturer",
                    "Bromsvätska"
                ],
                correct: 2,
                explanation: "Spolarvätska är vindrutetorkarvätska som ska tåla -18°C eller lägre i Sverige.",
                explanationUrdu: "<strong>Spolarvätska windshield washer fluid hai jo -18°C ya us se kam temperature par bhi freeze nahi hoti.</strong><br><br><strong>Kyun important hai?</strong><br>Sweden mein winter mein temperature -20°C ya us se bhi kam ho jata hai. Normal pani freeze ho kar barf ban jayega aur windshield saaf nahi hogi. Spolarvätska special fluid hai jo itni thand mein bhi liquid rehti hai aur windshield ko saaf rakhti hai."
            },
            {
                question: "Hur säkrar du bagage i en taxi?",
                questionUrdu: "Taxi mein luggage ko kaise secure karenge?",
                options: [
                    "Lägger det i bagageutrymmet utan att säkra",
                    "Använder remmar eller band för att fästa det",
                    "Ber passageraren hålla det",
                    "Kör långsammare"
                ],
                correct: 1,
                explanation: "Bagage ska säkras med remmar eller band så att det inte rör sig under körning.",
                explanationUrdu: "<strong>Luggage ko straps ya ribbon se fix karna chahiye taake travel ke doran move na ho.</strong><br><br><strong>Kyun?</strong><br>Agar luggage secure na ho to brake ya turn ke waqt luggage slide ho kar passengers ko chot pohancha sakta hai. Taxi driver hone ke naate aapki zimmedari hai ke passengers ka luggage safe rahe. Isliye straps ya bands use kar ke luggage ko fix karen."
            },
            {
                question: "Vad gör du när examinatorn ber dig kontrollera bromsljusen?",
                questionUrdu: "Jab examiner kahe brake lights check karwao to kya karenge?",
                options: [
                    "Trycker på bromspedalen och sitter kvar",
                    "Ber examinatorn gå ut och kontrollera, eller går ut själv",
                    "Ignorerar frågan",
                    "Säger att de fungerar"
                ],
                correct: 1,
                explanation: "Du måste faktiskt visa att ljusen fungerar genom att låta någon kontrollera dem utifrån.",
                explanationUrdu: "<strong>Aapko actually demonstrate karna hai - examiner ko bahar bhejo ya khud bahar jakar dikhao ke light kaam kar rahi hai.</strong><br><br><strong>Kaise karen?</strong><br>Jab examiner kahe 'kontrollera bromsljusen', to sirf brake pedal dabana kafi nahi. Aapko examiner se kahna hai ke 'Var snäll och kontrollera utifrån' ya khud bahar jakar dikhana hai ke brake lights kaam kar rahi hain. Examiner expect karta hai ke aap actually check karwa ke dikhayen."
            },
            {
                question: "Var hittar du bromsvätskebehållaren?",
                questionUrdu: "Brake fluid ka reservoir kahan hota hai?",
                options: [
                    "I bagageutrymmet",
                    "Under bilen",
                    "I motorrummet, vanligtvis nära förarplatsen",
                    "I handskfacket"
                ],
                correct: 2,
                explanation: "Bromsvätskebehållaren finns i motorrummet, vanligtvis nära förarplatsen.",
                explanationUrdu: "<strong>Brake fluid ka tank engine bay mein hota hai, usually driver seat ke qareeb.</strong><br><br><strong>Kaise pehchanen?</strong><br>Hood kholen. Engine bay mein driver seat ki taraf ek chhota sa tank hoga jisme yellowish/brownish liquid hota hai. Tank par brake ka symbol bana hoga. Yeh brake fluid hai jo brake system ko operate karti hai."
            },
            {
                question: "Var hittar du motoroljan?",
                questionUrdu: "Engine oil kahan hota hai?",
                options: [
                    "I bagageutrymmet",
                    "I motorrummet, mätstickan och påfyllningslocket",
                    "Under bilen",
                    "I handskfacket"
                ],
                correct: 1,
                explanation: "Motoroljan finns i motorrummet – mätstickan visar oljenivån och påfyllningslocket används för att fylla på.",
                explanationUrdu: "<strong>Engine oil engine bay mein hota hai - dipstick se level check karte hain aur cap se oil dalte hain.</strong><br><br><strong>Kaise check karen?</strong><br>Hood kholen. Engine ke upar ek yellow/orange ring hogi - yeh dipstick hai. Ise bahar nikalen, cloth se saaf karen, wapis dalen aur phir nikal kar dekhen ke oil level kahan hai. Oil dalne ke liye engine par ek cap hoga jisme oil symbol bana hoga."
            },
            {
                question: "Var hittar du kylarvätskebehållaren?",
                questionUrdu: "Coolant ka tank kahan hota hai?",
                options: [
                    "I bagageutrymmet",
                    "I motorrummet, ofta en genomskinlig behållare med färgad vätska",
                    "Under sätet",
                    "I handskfacket"
                ],
                correct: 1,
                explanation: "Kylarvätskebehållaren finns i motorrummet, ofta en genomskinlig behållare med färgad vätska.",
                explanationUrdu: "<strong>Coolant tank engine bay mein hota hai, aksar transparent container mein colored liquid ke sath.</strong><br><br><strong>Kaise pehchanen?</strong><br>Engine bay mein ek transparent ya semi-transparent tank hoga jisme pink, green, ya blue color ka liquid hoga. Tank par MIN aur MAX ka mark hoga. Yeh coolant hai jo engine ko cool rakhti hai."
            },
            {
                question: "Var finns bilbatteriet?",
                questionUrdu: "Car battery kahan hoti hai?",
                options: [
                    "I bagageutrymmet",
                    "I motorrummet, vanligtvis nära ena hörnet",
                    "Under bilen",
                    "I handskfacket"
                ],
                correct: 1,
                explanation: "Bilbatteriet finns vanligtvis i motorrummet, nära ena hörnet.",
                explanationUrdu: "<strong>Car battery usually engine bay mein hoti hai, ek corner ke qareeb.</strong><br><br><strong>Kaise pehchanen?</strong><br>Engine bay mein ek corner par black box hoga jisme se do moti cables nikal rahi hongi (ek red positive, ek black negative). Yeh car battery hai jo car start karne aur electrical systems ko power deti hai."
            },
            {
                question: "Hur många frågor finns på säkerhetsteoriprovet för taxi?",
                questionUrdu: "Taxi safety theory exam mein kitne questions hote hain?",
                options: ["30 frågor", "40 frågor", "50 frågor", "60 frågor"],
                correct: 2,
                explanation: "Säkerhetsteoriprovet för taxi har 50 frågor och du måste svara rätt på minst 45.",
                explanationUrdu: "<strong>Safety theory exam mein 50 questions hote hain aur kam az kam 45 sahi karne parte hain.</strong><br><br><strong>Matlab?</strong><br>Aapko 50 mein se 45 questions sahi karne hain. 5 questions ghalat hone ki gunjaish hai. Isliye achay se taiyari karen aur kam az kam 90% score karen."
            },
            {
                question: "Hur många frågor måste du svara rätt på för att godkännas på säkerhetsteoriprovet?",
                questionUrdu: "Safety theory exam pass karne ke liye kitne questions sahi karne parte hain?",
                options: ["40 av 50", "42 av 50", "45 av 50", "48 av 50"],
                correct: 2,
                explanation: "Du måste svara rätt på minst 45 av 50 frågor för att godkännas.",
                explanationUrdu: "<strong>Aapko kam az kam 45 out of 50 questions sahi karne parte hain pass hone ke liye.</strong><br><br><strong>Percentage?</strong><br>45/50 = 90%. Matlab aapko 90% score karna hai pass hone ke liye. Sirf 5 questions ghalat hone ki gunjaish hai."
            },
            {
                question: "Hur länge är dina godkända teoriprov giltiga?",
                questionUrdu: "Pass kiye hue theory exams kitne time tak valid rehte hain?",
                options: ["1 år", "2 år", "3 år", "5 år"],

        let currentPart = 1;
        let currentQuestion = 0;
        let score = 0;
        let currentLang = 'sv';
        let answered = new Array(quizDataPart1.length).fill(null);

        function switchPart(part) {
            currentPart = part;
            currentQuestion = 0;
            score = 0;
            
            if (part === 1) {
                answered = new Array(quizDataPart1.length).fill(null);
            } else {
                answered = new Array(quizDataPart2.length).fill(null);
            }
            
            document.querySelectorAll('.part-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.part-btn')[part - 1].classList.add('active');
            
            document.getElementById('result').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            document.getElementById('scoreBox').classList.add('hidden');
            document.getElementById('submit').classList.remove('hidden');
            
            renderQuestion();
            renderQuestionSelector();
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuestion();
        }

        function getCurrentData() {
            return currentPart === 1 ? quizDataPart1 : quizDataPart2;
        }

        function renderQuestionSelector() {
            const data = getCurrentData();
            const selector = document.getElementById('questionSelector');
            selector.innerHTML = data.map((_, i) => {
                let className = 'q-btn';
                if (i === currentQuestion) className += ' current';
                if (answered[i] === true) className += ' answered-correct';
                if (answered[i] === false) className += ' answered-wrong';
                return `<button class="${className}" onclick="goToQuestion(${i})">${i + 1}</button>`;
            }).join('');
        }

        function goToQuestion(index) {
            currentQuestion = index;
            document.getElementById('result').classList.add('hidden');
            document.getElementById('scoreBox').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            renderQuestion();
            renderQuestionSelector();
        }

        function renderQuestion() {
            const data = getCurrentData();
            const currentData = data[currentQuestion];
            
            document.getElementById('progress').textContent = currentLang === 'sv' 
                ? `Part ${currentPart} - Fråga ${currentQuestion + 1} av ${data.length}`
                : `Part ${currentPart} - Sawal ${currentQuestion + 1} of ${data.length}`;
            
            document.getElementById('question').textContent = currentData.question;
            document.getElementById('questionUrdu').textContent = currentData.questionUrdu;
            
            if (currentLang === 'ur') {
                document.getElementById('questionUrdu').classList.remove('hidden');
            } else {
                document.getElementById('questionUrdu').classList.add('hidden');
            }

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = currentData.options.map((option, i) => `
                <label>
                    <input type="radio" name="answer" value="${i}">
                    ${option}
                </label>
            `).join('');

            document.getElementById('submit').textContent = currentLang === 'sv' 
                ? 'Kontrollera svar' 
                : 'Check Answer';
        }

        function checkAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert(currentLang === 'sv' ? 'Välj ett svar först!' : 'Pehle answer select karen!');
                return;
            }

            const data = getCurrentData();
            const currentData = data[currentQuestion];
            const answer = parseInt(selected.value);
            const resultDiv = document.getElementById('result');
            
            answered[currentQuestion] = (answer === currentData.correct);
            
            if (answer === currentData.correct) {
                score++;
                resultDiv.className = 'result correct';
                resultDiv.innerHTML = `
                    <div class="result-title">✓ ${currentLang === 'sv' ? 'Rätt!' : 'Sahi Jawab!'}</div>
                    <div class="explanation">
                        <div class="explanation-title">${currentLang === 'sv' ? 'Förklaring:' : 'Tafseel:'}</div>
                        <div class="explanation-sv">${currentData.explanation}</div>
                        <div class="explanation-ur">${currentData.explanationUrdu}</div>
                    </div>
                `;
            } else {
                resultDiv.className = 'result incorrect';
                resultDiv.innerHTML = `
                    <div class="result-title">✗ ${currentLang === 'sv' ? 'Fel!' : 'Ghalat Jawab!'}</div>
                    <div class="explanation">
                        <div class="explanation-title">${currentLang === 'sv' ? 'Rätt svar:' : 'Sahi Jawab:'}</div>
                        <div class="explanation-sv">${currentData.options[currentData.correct]}</div>
                        <div class="explanation-title" style="margin-top:10px;">${currentLang === 'sv' ? 'Förklaring:' : 'Tafseel:'}</div>
                        <div class="explanation-sv">${currentData.explanation}</div>
                        <div class="explanation-ur">${currentData.explanationUrdu}</div>
                    </div>
                `;
            }

            resultDiv.classList.remove('hidden');
            document.getElementById('navButtons').classList.remove('hidden');
            document.getElementById('submit').classList.add('hidden');
            renderQuestionSelector();
        }

        function nextQuestion() {
            const data = getCurrentData();
            if (currentQuestion < data.length - 1) {
                currentQuestion++;
                document.getElementById('result').classList.add('hidden');
                document.getElementById('navButtons').classList.add('hidden');
                document.getElementById('submit').classList.remove('hidden');
                renderQuestion();
                renderQuestionSelector();
            } else {
                showFinalScore();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                document.getElementById('result').classList.add('hidden');
                document.getElementById('navButtons').classList.add('hidden');
                document.getElementById('submit').classList.remove('hidden');
                renderQuestion();
                renderQuestionSelector();
            }
        }

        function showFinalScore() {
            const data = getCurrentData();
            document.getElementById('result').classList.add('hidden');
            document.getElementById('navButtons').classList.add('hidden');
            document.getElementById('submit').classList.add('hidden');
            document.getElementById('scoreBox').classList.remove('hidden');
            document.getElementById('scoreNumber').textContent = `${score}/${data.length}`;
            document.getElementById('scoreText').textContent = currentLang === 'sv' 
                ? 'Rätta svar' 
                : 'Sahi jawab';
            document.getElementById('options').innerHTML = '';
            document.getElementById('question').textContent = currentLang === 'sv' 
                ? `Grattis! Du har klarat Part ${currentPart}!` 
                : `Mubarak ho! Aapne Part ${currentPart} complete kar liya!`;
            document.getElementById('questionUrdu').textContent = '';
            document.getElementById('progress').textContent = '';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered.fill(null);
            document.getElementById('scoreBox').classList.add('hidden');
            document.getElementById('submit').classList.remove('hidden');
            renderQuestion();
            renderQuestionSelector();
        }

        // Initialize
        renderQuestion();
        renderQuestionSelector();
    </script>
