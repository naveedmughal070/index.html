<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi License Quiz - Game Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .lang-toggle {
            text-align: center;
            margin-bottom: 25px;
        }
        .lang-btn {
            padding: 10px 25px;
            margin: 0 5px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
        }
        .lang-btn:hover {
            transform: scale(1.05);
        }
        .progress {
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: bold;
        }
        .question-box {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            margin-bottom: 25px;
        }
        .question {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .question-urdu {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
            font-style: italic;
        }
        .options label {
            display: block;
            margin: 12px 0;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .options label:hover {
            background: #e0e7ff;
            border-color: #667eea;
        }
        input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
        }
        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .result.correct {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        .result.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        .result-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .result.correct .result-title {
            color: #28a745;
        }
        .result.incorrect .result-title {
            color: #dc3545;
        }
        .explanation {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .explanation-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .explanation-sv {
            color: #333;
            margin-bottom: 10px;
        }
        .explanation-ur {
            color: #555;
            font-style: italic;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
        .score-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .score-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .hidden {
            display: none;
        }
        .question-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .q-btn {
            padding: 15px;
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            transition: 0.3s;
        }
        .q-btn:hover {
            background: #667eea;
            color: white;
        }
        .q-btn.answered-correct {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        .q-btn.answered-wrong {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }
